<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para a Banda da Escola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form action="#" method="post">
        <h1>🪕 Teste para a Banda<br><span>Grupo Revelação</span></h1>

        <div class="campo">
            <label for="nome">Seu nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>
        </div>

        <div class="campo">
            <label for="idade">Sua idade:</label>
            <input type="number" id="idade" name="idade" placeholder="Ex: 22" required>
        </div>

        <div class="campo">
            <label for="instrumento">Qual instrumento você toca?</label>
            <input type="text" id="instrumento" name="instrumento" placeholder="Ex: Cavaco, Bateria, Canto..." required>
        </div>

        <button type="submit">Garantir meu teste 🎤</button>
    </form>

</body>
</html>
